<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öztimurlar MTAL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      position: relative;
    }
    .lang-switcher {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.25rem 0.5rem;
    }
    .lang-switcher select {
      background: transparent;
      color: #cbd5e1;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      font-weight: 500;
    }
    .lang-switcher select option {
      background: #1e293b;
      color: #f8fafc;
    }
    .card {
      max-width: 580px;
      width: 100%;
      text-align: center;
      padding: 2.5rem 2rem;
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid #1e293b;
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Dil Seçici Kutu -->
  <div class="lang-switcher">
    <select id="langSelect" onchange="changeLanguage(this.value)">
      <option value="tr">TR (Türkçe)</option>
      <option value="en">EN (English)</option>
    </select>
  </div>

  <main class="card">
    <div class="badge" id="badgeText">Tadilat Aşamasında</div>
    <h1 id="titleText">Öztimurlar MTAL</h1>
    <p id="descText">
      Bu sezonun aktif üye alımları sebebiyle web sitemiz geçici olarak tadilattadır. En yakın zamanda tekrar aktifleşecektir.
    </p>
  </main>

  <script>
    const content = {
      tr: {
        badge: "Tadilat Aşamasında",
        title: "Öztimurlar MTAL",
        desc: "Bu sezonun aktif üye alımları sebebiyle web sitemiz geçici olarak tadilattadır. En yakın zamanda tekrar aktifleşecektir."
      },
      en: {
        badge: "Under Maintenance",
        title: "Öztimurlar MTAL",
        desc: "Due to active member recruitment for this season, our website is temporarily under maintenance. It will be active again soon."
      }
    };

    function changeLanguage(lang) {
      document.getElementById("badgeText").innerText = content[lang].badge;
      document.getElementById("titleText").innerText = content[lang].title;
      document.getElementById("descText").innerText = content[lang].desc;
      document.documentElement.lang = lang;
    }
  </script>

</body>
</html>
