<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öztimurlar MTAL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem;
    }
    .lang-nav {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .lang-btn {
      background: none;
      border: none;
      color: #555555;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      padding: 0;
    }
    .lang-btn.active {
      color: #ffffff;
    }
    .divider {
      color: #333333;
    }
    main {
      max-width: 560px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #888888;
    }
    footer {
      font-size: 0.8rem;
      color: #333333;
    }
  </style>
</head>
<body>

  <div class="lang-nav">
    <button class="lang-btn active" id="btn-tr" onclick="setLang('tr')">TR</button>
    <span class="divider">/</span>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>

  <main>
    <h1 id="title">Öztimurlar MTAL</h1>
    <p id="desc">
      Bu sezonun aktif üye alımları sebebiyle web sitemiz geçici olarak tadilattadır. En yakın zamanda tekrar aktifleşecektir.
    </p>
  </main>

  <footer>
    <span>&copy; 2026</span>
  </footer>

  <script>
    const data = {
      tr: {
        title: "Öztimurlar MTAL",
        desc: "Bu sezonun aktif üye alımları sebebiyle web sitemiz geçici olarak tadilattadır. En yakın zamanda tekrar aktifleşecektir."
      },
      en: {
        title: "Öztimurlar MTAL",
        desc: "Due to active member recruitment for this season, our website is temporarily under maintenance. It will be back online shortly."
      }
    };

    function setLang(lang) {
      document.getElementById('title').textContent = data[lang].title;
      document.getElementById('desc').textContent = data[lang].desc;
      document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang;
    }
  </script>

</body>
</html>
